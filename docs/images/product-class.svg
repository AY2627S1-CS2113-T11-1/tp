<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1090 770" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Product catalogue class diagram</title>
  <desc id="desc">The four product commands inherit from the abstract Command class and depend on ProductList; DeleteProductCommand also depends on OrderList and StockList. A ProductList is composed of Products.</desc>
  <!-- Hand-drawn to follow the course UML reference sheet; edit this file directly (there is no .mmd source). -->
  <defs>
    <marker id="open-arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#40566f" stroke-width="1.3"/>
    </marker>
    <style>
      text { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 15px; fill: #1f2933; }
      .box { fill: #eef4fb; stroke: #40566f; stroke-width: 1.3; }
      .divider { stroke: #40566f; stroke-width: 1.3; }
      .name { text-anchor: middle; font-weight: bold; }
      .keyword { text-anchor: middle; }
      .line { stroke: #40566f; stroke-width: 1.3; fill: none; }
      .dependency { stroke: #40566f; stroke-width: 1.3; stroke-dasharray: 6 4; fill: none; marker-end: url(#open-arrow); }
    </style>
  </defs>
  <rect width="1090" height="770" fill="white"/>

  <!-- {abstract} Command -->
  <rect class="box" x="270" y="20" width="540" height="94"/>
  <text class="keyword" x="540" y="40">{abstract}</text>
  <text class="name" x="540" y="61">Command</text>
  <line class="divider" x1="270" y1="70" x2="810" y2="70"/>
  <line class="divider" x1="270" y1="80" x2="810" y2="80"/>
  <text x="282" y="102">+ execute(products, orders, expenses, stocks, ui) : void {abstract}</text>

  <!-- Inheritance: one hollow triangle shared by the four subclasses -->
  <path d="M540,114 L550,130 L530,130 Z" fill="white" stroke="#40566f" stroke-width="1.3"/>
  <line class="line" x1="540" y1="130" x2="540" y2="160"/>
  <line class="line" x1="130" y1="160" x2="885" y2="160"/>
  <line class="line" x1="130" y1="160" x2="130" y2="200"/>
  <line class="line" x1="370" y1="160" x2="370" y2="200"/>
  <line class="line" x1="610" y1="160" x2="610" y2="200"/>
  <line class="line" x1="885" y1="160" x2="885" y2="200"/>

  <!-- Command subclasses -->
  <rect class="box" x="20" y="200" width="220" height="82"/>
  <text class="name" x="130" y="221">AddProductCommand</text>
  <line class="divider" x1="20" y1="232" x2="240" y2="232"/>
  <text x="32" y="252">- name : String</text>
  <text x="32" y="272">- price : BigDecimal</text>

  <rect class="box" x="270" y="200" width="200" height="32"/>
  <text class="name" x="370" y="221">ListProductCommand</text>

  <rect class="box" x="500" y="200" width="220" height="62"/>
  <text class="name" x="610" y="221">FindProductCommand</text>
  <line class="divider" x1="500" y1="232" x2="720" y2="232"/>
  <text x="512" y="252">- keyword : String</text>

  <rect class="box" x="750" y="200" width="270" height="62"/>
  <text class="name" x="885" y="221">DeleteProductCommand</text>
  <line class="divider" x1="750" y1="232" x2="1020" y2="232"/>
  <text x="762" y="252">- name : String</text>

  <!-- Dependencies: the lists are passed to execute, not stored, so they are dashed arrows -->
  <line class="dependency" x1="130" y1="282" x2="150" y2="380"/>
  <line class="dependency" x1="370" y1="232" x2="330" y2="380"/>
  <line class="dependency" x1="610" y1="262" x2="430" y2="380"/>
  <line class="dependency" x1="790" y1="262" x2="460" y2="440"/>
  <line class="dependency" x1="885" y1="262" x2="885" y2="380"/>
  <polyline class="dependency" points="1020,240 1065,240 1065,537 1040,537"/>

  <!-- ProductList -->
  <rect class="box" x="60" y="380" width="400" height="154"/>
  <text class="name" x="260" y="401">ProductList</text>
  <line class="divider" x1="60" y1="412" x2="460" y2="412"/>
  <line class="divider" x1="60" y1="422" x2="460" y2="422"/>
  <text x="72" y="442">+ add(product : Product) : void</text>
  <text x="72" y="462">+ remove(product : Product) : void</text>
  <text x="72" y="482">+ findByName(name : String) : Product</text>
  <text x="72" y="502">+ findByKeyword(keyword : String) : List&lt;Product&gt;</text>
  <text x="72" y="522">+ getSortedByName() : List&lt;Product&gt;</text>

  <!-- OrderList and StockList, showing only the methods product delete uses -->
  <rect class="box" x="590" y="380" width="450" height="74"/>
  <text class="name" x="815" y="401">OrderList</text>
  <line class="divider" x1="590" y1="412" x2="1040" y2="412"/>
  <line class="divider" x1="590" y1="422" x2="1040" y2="422"/>
  <text x="602" y="442">+ findActiveOrderWithProduct(productName : String) : Order</text>

  <rect class="box" x="590" y="500" width="450" height="74"/>
  <text class="name" x="815" y="521">StockList</text>
  <line class="divider" x1="590" y1="532" x2="1040" y2="532"/>
  <line class="divider" x1="590" y1="542" x2="1040" y2="542"/>
  <text x="602" y="562">+ removeByProduct(productName : String) : boolean</text>

  <!-- Composition: a ProductList is made of its Products -->
  <path d="M260,534 L268,546 L260,558 L252,546 Z" fill="#40566f" stroke="#40566f" stroke-width="1.3"/>
  <line class="line" x1="260" y1="558" x2="260" y2="640"/>
  <text x="270" y="632">*</text>

  <!-- Product -->
  <rect class="box" x="130" y="640" width="260" height="104"/>
  <text class="name" x="260" y="661">Product</text>
  <line class="divider" x1="130" y1="672" x2="390" y2="672"/>
  <text x="142" y="692">- name : String</text>
  <text x="142" y="712">- price : BigDecimal</text>
  <text x="142" y="732">- stock : int</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="740" height="380" viewBox="0 0 740 380" role="img" aria-labelledby="title desc">
  <title id="title">Sales List sequence</title>
  <desc id="desc">Main successful execution flow. Validation and alternatives are described in the Developer Guide.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#40566f"/></marker>
    <style>
      .head { fill:#eef4fb; stroke:#40566f; stroke-width:1.3; }
      .name { fill:#1f2933; font:14px Arial,sans-serif; text-anchor:middle; }
      .life { stroke:#8a98a8; stroke-width:1.2; stroke-dasharray:5 5; }
      .msg { stroke:#40566f; stroke-width:1.3; marker-end:url(#arrow); }
      .text { fill:#1f2933; font:13px Arial,sans-serif; text-anchor:middle; }
      .activation { fill:#ffffff; stroke:#40566f; stroke-width:1.2; }
    </style>
  </defs>
  <rect width="740" height="380" fill="white"/>
  <rect class="head" x="22" y="20" width="156" height="48" rx="5"/>
  <text class="name"><tspan x="100" y="49">Duke</tspan></text>
  <line class="life" x1="100" y1="68" x2="100" y2="365"/>
  <rect class="head" x="202" y="20" width="156" height="48" rx="5"/>
  <text class="name"><tspan x="280" y="40">ListSales</tspan><tspan x="280" y="57">Command</tspan></text>
  <line class="life" x1="280" y1="68" x2="280" y2="365"/>
  <rect class="head" x="382" y="20" width="156" height="48" rx="5"/>
  <text class="name"><tspan x="460" y="49">OrderList</tspan></text>
  <line class="life" x1="460" y1="68" x2="460" y2="365"/>
  <rect class="head" x="562" y="20" width="156" height="48" rx="5"/>
  <text class="name"><tspan x="640" y="49">Ui</tspan></text>
  <line class="life" x1="640" y1="68" x2="640" y2="365"/>
  <rect class="activation" x="95" y="95" width="10" height="230"/>
  <rect class="activation" x="455" y="150" width="10" height="40"/>
  <rect class="activation" x="635" y="230" width="10" height="40"/>
  <rect class="activation" x="275" y="110" width="10" height="200"/>
  <line class="msg" x1="105" y1="110" x2="275" y2="110"/>
  <text class="text" x="190" y="101">execute(...)</text>
  <line class="msg" x1="285" y1="150" x2="455" y2="150"/>
  <text class="text" x="370" y="141">getConfirmedSales()</text>
  <line class="msg" x1="455" y1="190" x2="285" y2="190" stroke-dasharray="5 4"/>
  <text class="text" x="370" y="181">Non-cancelled orders</text>
  <line class="msg" x1="285" y1="230" x2="635" y2="230"/>
  <text class="text" x="460" y="221">showSales(sales)</text>
  <line class="msg" x1="635" y1="270" x2="285" y2="270" stroke-dasharray="5 4"/>
  <text class="text" x="460" y="261">return</text>
  <line class="msg" x1="275" y1="310" x2="105" y2="310" stroke-dasharray="5 4"/>
  <text class="text" x="190" y="301">return</text>
</svg>

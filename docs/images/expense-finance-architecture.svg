<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="820" viewBox="0 0 1450 820" role="img" aria-labelledby="title desc">
  <title id="title">Expense and finance UML object diagram</title>
  <desc id="desc">UML object diagram using object name colon class name notation, with concrete expense, order, product, command, list, and user interface objects.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#222"/></marker>
    <style>
      .object { fill:#ececff; stroke:#9370db; stroke-width:2; }
      .name { fill:#111; font:17px Arial,sans-serif; text-anchor:middle; text-decoration:underline; }
      .value { fill:#111; font:14px Arial,sans-serif; }
      .line { stroke:#222; stroke-width:1.8; fill:none; }
      .label { fill:#111; font:14px Arial,sans-serif; }
      .heading { fill:#d65f00; font:28px Arial,sans-serif; }
    </style>
  </defs>
  <rect width="1450" height="820" fill="white"/>
  <text class="heading" x="35" y="42">Expense and finance [object diagram]</text>

  <!-- command objects -->
  <g transform="translate(45,100)"><rect class="object" width="330" height="112"/><text class="name" x="165" y="30">addExpense : AddExpenseCommand</text><line class="line" x1="0" y1="45" x2="330" y2="45"/><text class="value" x="14" y="72">productName = "Packaging"</text><text class="value" x="14" y="95">amount = 25.00</text></g>
  <g transform="translate(45,270)"><rect class="object" width="330" height="62"/><text class="name" x="165" y="38">listExpenses : ListExpenseCommand</text></g>
  <g transform="translate(45,390)"><rect class="object" width="330" height="62"/><text class="name" x="165" y="38">showFinances : FinancesCommand</text></g>

  <!-- expense objects -->
  <g transform="translate(485,90)"><rect class="object" width="350" height="82"/><text class="name" x="175" y="31">expenses : ExpenseList</text><line class="line" x1="0" y1="46" x2="350" y2="46"/><text class="value" x="14" y="70">expenses = {packagingExpense, utilitiesExpense}</text></g>
  <g transform="translate(485,240)"><rect class="object" width="350" height="104"/><text class="name" x="175" y="30">packagingExpense : Expense</text><line class="line" x1="0" y1="45" x2="350" y2="45"/><text class="value" x="14" y="72">productName = "Packaging"</text><text class="value" x="14" y="95">amount = 25.00</text></g>
  <g transform="translate(485,395)"><rect class="object" width="350" height="104"/><text class="name" x="175" y="30">utilitiesExpense : Expense</text><line class="line" x1="0" y1="45" x2="350" y2="45"/><text class="value" x="14" y="72">productName = "Utilities"</text><text class="value" x="14" y="95">amount = 80.00</text></g>

  <!-- order objects -->
  <g transform="translate(1020,90)"><rect class="object" width="350" height="82"/><text class="name" x="175" y="31">orders : OrderList</text><line class="line" x1="0" y1="46" x2="350" y2="46"/><text class="value" x="14" y="70">orders = {order1}</text></g>
  <g transform="translate(1020,240)"><rect class="object" width="350" height="128"/><text class="name" x="175" y="30">order1 : Order</text><line class="line" x1="0" y1="45" x2="350" y2="45"/><text class="value" x="14" y="72">id = 1; customer = "Alex"</text><text class="value" x="14" y="96">paidAmount = 12.00</text><text class="value" x="14" y="119">isCancelled = false</text></g>
  <g transform="translate(1020,430)"><rect class="object" width="350" height="104"/><text class="name" x="175" y="30">item1 : OrderItem</text><line class="line" x1="0" y1="45" x2="350" y2="45"/><text class="value" x="14" y="72">quantity = 2</text><text class="value" x="14" y="95">unitPrice = 6.00</text></g>
  <g transform="translate(1020,595)"><rect class="object" width="350" height="104"/><text class="name" x="175" y="30">coffee : Product</text><line class="line" x1="0" y1="45" x2="350" y2="45"/><text class="value" x="14" y="72">name = "Coffee"; price = 6.00</text><text class="value" x="14" y="95">stock = 8</text></g>

  <!-- ui object -->
  <g transform="translate(485,620)"><rect class="object" width="350" height="82"/><text class="name" x="175" y="31">ui : Ui</text><line class="line" x1="0" y1="46" x2="350" y2="46"/><text class="value" x="14" y="70">display = console</text></g>

  <!-- dependency links route through open space and end at object edges -->
  <path class="line" d="M375,156 L410,156 L410,110 L485,110" marker-end="url(#arrow)"/><text class="label" x="395" y="125">adds to</text>
  <path class="line" d="M375,301 L440,301 L440,150 L485,150" marker-end="url(#arrow)"/><text class="label" x="390" y="292">reads</text>
  <path class="line" d="M375,405 L465,405 L465,165 L485,165" marker-end="url(#arrow)"/><text class="label" x="385" y="395">reads</text>
  <path class="line" d="M375,437 L405,437 L405,560 L870,560 L940,560 L940,131 L1020,131" marker-end="url(#arrow)"/><text class="label" x="875" y="550">reads</text>
  <path class="line" d="M210,452 L210,575 L455,575 L455,682 L485,682" marker-end="url(#arrow)"/><text class="label" x="220" y="565">displays</text>

  <!-- containment links stay outside the object rectangles -->
  <path class="line" d="M660,172 L660,240" marker-end="url(#arrow)"/><text class="label" x="674" y="212">contains</text>
  <path class="line" d="M760,172 L860,172 L860,447 L835,447" marker-end="url(#arrow)"/><text class="label" x="866" y="438">contains</text>
  <path class="line" d="M1195,172 L1195,240" marker-end="url(#arrow)"/><text class="label" x="1209" y="212">contains</text>
  <path class="line" d="M1195,368 L1195,430" marker-end="url(#arrow)"/><text class="label" x="1209" y="404">contains</text>
  <path class="line" d="M1195,534 L1195,595" marker-end="url(#arrow)"/><text class="label" x="1209" y="570">refers to</text>
</svg>

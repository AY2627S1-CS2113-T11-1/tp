<svg id="finances-sequence" xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">Financial report sequence diagram</title>
  <desc id="desc">FinancesCommand collects confirmed orders, paid sales, and expenses, then asks Ui to show the report.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2933"/></marker><style>text{font-family:trebuchet ms,verdana,arial,sans-serif;font-size:16px;fill:#1f2933}.actor{fill:#eef4fb;stroke:#40566f;stroke-width:1.5}.life{stroke:#8a98a8;stroke-width:1;stroke-dasharray:5 5}.call{stroke:#1f2933;stroke-width:1.5;marker-end:url(#arrow)}.return{stroke:#1f2933;stroke-width:1.5;stroke-dasharray:3 3;marker-end:url(#arrow)}.activation{fill:#fff;stroke:#40566f;stroke-width:1}.label{text-anchor:middle;dominant-baseline:middle}.small{font-size:15px}</style></defs>
  <rect class="actor" x="25" y="10" width="230" height="58" rx="6"/><text class="label" x="140" y="39">command : FinancesCommand</text><line class="life" x1="140" y1="68" x2="140" y2="584"/>
  <rect class="actor" x="295" y="10" width="155" height="58" rx="6"/><text class="label" x="372" y="39">orders : OrderList</text><line class="life" x1="372" y1="68" x2="372" y2="584"/>
  <rect class="actor" x="490" y="10" width="180" height="58" rx="6"/><text class="label" x="580" y="39">expenses : ExpenseList</text><line class="life" x1="580" y1="68" x2="580" y2="584"/>
  <rect class="actor" x="755" y="10" width="150" height="58" rx="6"/><text class="label" x="830" y="39">ui : Ui</text><line class="life" x1="830" y1="68" x2="830" y2="584"/>
  <rect class="activation" x="135" y="112" width="10" height="420"/>
  <text class="label small" x="255" y="114">getConfirmedSales()</text><line class="call" x1="145" y1="126" x2="367" y2="126"/><rect class="activation" x="367" y="126" width="10" height="50"/>
  <text class="label small" x="255" y="164">confirmed orders</text><line class="return" x1="377" y1="176" x2="145" y2="176"/>
  <text class="label small" x="255" y="230">getPaidSales()</text><line class="call" x1="145" y1="242" x2="367" y2="242"/><rect class="activation" x="367" y="242" width="10" height="50"/>
  <text class="label small" x="255" y="280">paid sales</text><line class="return" x1="377" y1="292" x2="145" y2="292"/>
  <text class="label small" x="360" y="350">getExpenses()</text><line class="call" x1="145" y1="362" x2="575" y2="362"/><rect class="activation" x="575" y="362" width="10" height="50"/>
  <text class="label small" x="360" y="400">expense records</text><line class="return" x1="585" y1="412" x2="145" y2="412"/>
  <text class="label small" x="488" y="470">showFinances(orders, paidSales, expenses)</text><line class="call" x1="145" y1="482" x2="825" y2="482"/><rect class="activation" x="825" y="482" width="10" height="50"/>
  <text class="label small" x="488" y="520">report displayed</text><line class="return" x1="835" y1="532" x2="145" y2="532"/>
</svg>

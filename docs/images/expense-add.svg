<svg id="expense-add-sequence" xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Adding an expense sequence diagram</title>
  <desc id="desc">AddExpenseCommand creates an Expense, adds it to ExpenseList, and asks Ui to show confirmation.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2933"/></marker><style>text{font-family:trebuchet ms,verdana,arial,sans-serif;font-size:16px;fill:#1f2933}.actor{fill:#eef4fb;stroke:#40566f;stroke-width:1.5}.life{stroke:#8a98a8;stroke-width:1;stroke-dasharray:5 5}.call{stroke:#1f2933;stroke-width:1.5;marker-end:url(#arrow)}.return{stroke:#1f2933;stroke-width:1.5;stroke-dasharray:3 3;marker-end:url(#arrow)}.activation{fill:#fff;stroke:#40566f;stroke-width:1}.label{text-anchor:middle;dominant-baseline:middle}.small{font-size:15px}</style></defs>
  <rect class="actor" x="35" y="10" width="230" height="58" rx="6"/><text class="label" x="150" y="39">command : AddExpenseCommand</text><line class="life" x1="150" y1="68" x2="150" y2="584"/>
  <rect class="actor" x="305" y="10" width="180" height="58" rx="6"/><text class="label" x="395" y="39">expenses : ExpenseList</text><line class="life" x1="395" y1="68" x2="395" y2="584"/>
  <rect class="actor" x="525" y="10" width="180" height="58" rx="6"/><text class="label" x="615" y="39">ui : Ui</text><line class="life" x1="615" y1="68" x2="615" y2="584"/>
  <rect class="activation" x="145" y="112" width="10" height="420"/>
  <rect class="actor" x="735" y="170" width="170" height="58" rx="6"/><text class="label" x="820" y="199">expense : Expense</text><line class="life" x1="820" y1="228" x2="820" y2="584"/>
  <rect class="activation" x="815" y="242" width="10" height="54"/>
  <text class="label small" x="485" y="128">new Expense(productName, amount)</text><line class="call" x1="155" y1="124" x2="813" y2="124"/>
  <text class="label small" x="485" y="160">created expense</text><line class="return" x1="813" y1="156" x2="155" y2="156"/>
  <text class="label small" x="275" y="340">add(expense)</text><line class="call" x1="155" y1="332" x2="393" y2="332"/><rect class="activation" x="390" y="320" width="10" height="48"/>
  <text class="label small" x="275" y="396">added</text><line class="return" x1="393" y1="388" x2="155" y2="388"/>
  <text class="label small" x="382" y="460">showExpenseAdded(expense)</text><line class="call" x1="155" y1="452" x2="613" y2="452"/><rect class="activation" x="610" y="440" width="10" height="48"/>
  <text class="label small" x="382" y="516">confirmation displayed</text><line class="return" x1="613" y1="508" x2="155" y2="508"/>
</svg>

<svg id="expense-list-sequence" xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Listing expenses sequence diagram</title>
  <desc id="desc">ListExpenseCommand reads expenses from ExpenseList and asks Ui to display them.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2933"/></marker><style>text{font-family:trebuchet ms,verdana,arial,sans-serif;font-size:16px;fill:#1f2933}.actor{fill:#eef4fb;stroke:#40566f;stroke-width:1.5}.life{stroke:#8a98a8;stroke-width:1;stroke-dasharray:5 5}.call{stroke:#1f2933;stroke-width:1.5;marker-end:url(#arrow)}.return{stroke:#1f2933;stroke-width:1.5;stroke-dasharray:3 3;marker-end:url(#arrow)}.activation{fill:#fff;stroke:#40566f;stroke-width:1}.label{text-anchor:middle;dominant-baseline:middle}.small{font-size:15px}</style></defs>
  <rect class="actor" x="35" y="10" width="230" height="58" rx="6"/><text class="label" x="150" y="39">command : ListExpenseCommand</text><line class="life" x1="150" y1="68" x2="150" y2="454"/>
  <rect class="actor" x="330" y="10" width="180" height="58" rx="6"/><text class="label" x="420" y="39">expenses : ExpenseList</text><line class="life" x1="420" y1="68" x2="420" y2="454"/>
  <rect class="actor" x="575" y="10" width="150" height="58" rx="6"/><text class="label" x="650" y="39">ui : Ui</text><line class="life" x1="650" y1="68" x2="650" y2="454"/>
  <rect class="activation" x="145" y="112" width="10" height="300"/>
  <text class="label small" x="285" y="142">getExpenses()</text><line class="call" x1="155" y1="134" x2="418" y2="134"/><rect class="activation" x="415" y="122" width="10" height="58"/>
  <text class="label small" x="285" y="202">copy of expense records</text><line class="return" x1="418" y1="194" x2="155" y2="194"/>
  <text class="label small" x="400" y="292">showExpenses(expenses)</text><line class="call" x1="155" y1="284" x2="648" y2="284"/><rect class="activation" x="645" y="272" width="10" height="58"/>
  <text class="label small" x="400" y="352">list displayed</text><line class="return" x1="648" y1="344" x2="155" y2="344"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Financial report sequence</title>
  <desc id="desc">The finance command gets orders, paid sales, and expenses before displaying the report.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3 L0,6 Z" fill="#40566f"/></marker>
    <style>
      .head { fill:#eef4fb; stroke:#40566f; stroke-width:1.3; rx:5; }
      .name { fill:#1f2933; font:14px Arial, sans-serif; text-anchor:middle; dominant-baseline:middle; }
      .life { stroke:#8a98a8; stroke-width:1.2; stroke-dasharray:5 5; }
      .msg { stroke:#40566f; stroke-width:1.3; marker-end:url(#arrow); }
      .text { fill:#1f2933; font:13px Arial, sans-serif; }
    </style>
  </defs>
  <rect width="920" height="360" fill="white"/>
  <rect class="head" x="20" y="20" width="70" height="38"/><text class="name" x="55" y="39">User</text>
  <rect class="head" x="150" y="20" width="90" height="38"/><text class="name" x="195" y="39">Parser</text>
  <rect class="head" x="300" y="20" width="130" height="38"/><text class="name" x="365" y="39">FinancesCommand</text>
  <rect class="head" x="490" y="20" width="100" height="38"/><text class="name" x="540" y="39">OrderList</text>
  <rect class="head" x="650" y="20" width="105" height="38"/><text class="name" x="702" y="39">ExpenseList</text>
  <rect class="head" x="815" y="20" width="70" height="38"/><text class="name" x="850" y="39">Ui</text>
  <line class="life" x1="55" y1="58" x2="55" y2="335"/><line class="life" x1="195" y1="58" x2="195" y2="335"/><line class="life" x1="365" y1="58" x2="365" y2="335"/><line class="life" x1="540" y1="58" x2="540" y2="335"/><line class="life" x1="702" y1="58" x2="702" y2="335"/><line class="life" x1="850" y1="58" x2="850" y2="335"/>
  <line class="msg" x1="55" y1="90" x2="195" y2="90"/><text class="text" x="62" y="82">finances</text>
  <line class="msg" x1="195" y1="125" x2="365" y2="125"/><text class="text" x="210" y="117">FinancesCommand</text>
  <line class="msg" x1="365" y1="165" x2="540" y2="165"/><text class="text" x="380" y="157">getAll()</text>
  <line class="msg" x1="540" y1="190" x2="365" y2="190"/><text class="text" x="390" y="182">all orders</text>
  <line class="msg" x1="365" y1="225" x2="540" y2="225"/><text class="text" x="380" y="217">getPaidSales()</text>
  <line class="msg" x1="540" y1="250" x2="365" y2="250"/><text class="text" x="390" y="242">paid sales</text>
  <line class="msg" x1="365" y1="285" x2="702" y2="285"/><text class="text" x="430" y="277">getExpenses()</text>
  <line class="msg" x1="702" y1="310" x2="365" y2="310"/><text class="text" x="490" y="302">expense records</text>
  <line class="msg" x1="365" y1="335" x2="850" y2="335"/><text class="text" x="525" y="328">show financial report</text>
</svg>
